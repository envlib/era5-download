n_tasks = 8

check_target = true

# preset = "wrf"  # Variable preset. Available: "wrf", "all"
# variables = "sp,var_2t,cape"  # Additional variables by NetCDF name (case insensitive). Combined with preset if both set.

# work_dir = "/tmp/era5_dl"  # Optional: working directory for intermediate files. Uses a temp dir if not set.

[dates]
start_date = "1940-01-01"
end_date = "1940-01-01"

[bounds]
# min_lon = 145
# max_lon = 195
# min_lat = -60
# max_lat = -20

min_lon = 120
max_lon = 200
min_lat = -60
max_lat = -15

[source]
type = 's3'
provider = 'AWS'
env_auth = 'false'
region = 'us-west-2'
path = 'nsf-ncar-era5/'

